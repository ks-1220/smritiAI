kind = "web"
previewPath = "/"
title = "AI Automation Studio"
description = "A premium AI Automation Studio marketing website. Dark-mode-only, cinematic landing page showcasing AI-powered services: website design, AI assistants, and business automations. Targets growing businesses. Includes hero, services, workflow visualization, industries, process, case studies, pricing, FAQ, contact, and footer sections."
version = "1.0.0"
id = "artifacts/ai-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22936

[services.development]
run = "pnpm --filter @workspace/ai-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22936"
BASE_PATH = "/"
